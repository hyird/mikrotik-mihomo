name: Publish GHCR image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_CACHE_BUST=${{ github.run_id }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed image size
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          ref="${IMAGE}:latest"
          index_json="$(docker buildx imagetools inspect --raw "$ref")"
          rows="$(
            jq -r '
              .manifests[]
              | select(.platform.os != "unknown" and .platform.architecture != "unknown")
              | [
                  (.platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)),
                  .digest,
                  (.size // 0)
                ]
              | @tsv
            ' <<< "$index_json"
          )"

          if [ -z "$rows" ]; then
            echo "No platform manifests found for $ref" >&2
            exit 1
          fi

          {
            echo "Image: \`$ref\`"
            echo
            echo "| Platform | Layers | Compressed layers | Manifest + config | Total |"
            echo "|---|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%-18s %8s %18s %18s %18s\n' "PLATFORM" "LAYERS" "LAYER SIZE" "META SIZE" "TOTAL"

          while IFS=$'\t' read -r platform digest manifest_size; do
            manifest_json="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}")"
            layer_count="$(jq '.layers | length' <<< "$manifest_json")"
            layer_bytes="$(jq '[.layers[]?.size] | add // 0' <<< "$manifest_json")"
            config_bytes="$(jq '.config.size // 0' <<< "$manifest_json")"
            meta_bytes=$((manifest_size + config_bytes))
            total_bytes=$((layer_bytes + meta_bytes))

            layer_size="$(numfmt --to=iec-i --suffix=B "$layer_bytes")"
            meta_size="$(numfmt --to=iec-i --suffix=B "$meta_bytes")"
            total_size="$(numfmt --to=iec-i --suffix=B "$total_bytes")"

            printf '%-18s %8s %18s %18s %18s\n' "$platform" "$layer_count" "$layer_size" "$meta_size" "$total_size"
            echo "| \`$platform\` | $layer_count | $layer_size | $meta_size | $total_size |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$rows"
