mixed-port: 7897
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: {log_level}
unified-delay: true
find-process-mode: off

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  device: Mihomo
  mtu: 1500
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: {fake_cidr}
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "+.{suburl_domain}"
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-providers:
  node:
    type: http
    url: {suburl}
    interval: 1800
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
    exclude-filter: "expired|traffic|official|reset|ban"

proxy-groups:
  - name: "Proxy"
    type: select
    use:
      - node

rules:
  - "DOMAIN-SUFFIX,{suburl_domain},DIRECT"
  - "GEOIP,CN,DIRECT"
  - "MATCH,Proxy"

external-controller: 0.0.0.0:{clash_web_port}
secret: {clash_web_password}
external-ui: "./ui"
external-ui-name: xd
