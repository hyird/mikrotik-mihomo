version: "3.8"

services:
  mihomo:
    image: ghcr.io/hyird/mikrotik-mihomo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mihomo
    hostname: mihomo

    network_mode: host

    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
      - SYS_MODULE

    environment:
      - FAKE_CIDR=198.18.0.0/16
      - CLASH_WEB_PORT=80
      - DEFAULT_BACKEND_URL=window.location.origin
      - SLEEPTIME=30
      - SUBURL=https://example.com/subscribe
      - TUN_STACK=mixed
      - TUN_DEVICE=mihomo
      - TUN_AUTO_ROUTE=true
      - TUN_AUTO_REDIRECT=false
      - TUN_AUTO_DETECT_INTERFACE=true
      - TUN_STRICT_ROUTE=true
      - TUN_INET4_ADDRESS=172.19.0.1/30
      - TUN_MTU=9000
      - TUN_GSO=true
      - TUN_GSO_MAX_SIZE=65536
      - TUN_IPROUTE2_TABLE_INDEX=2022
      - TUN_IPROUTE2_RULE_INDEX=9000
      - TUN_ENDPOINT_INDEPENDENT_NAT=true
      - TUN_UDP_TIMEOUT=300
      - TZ=Asia/Shanghai

    restart: unless-stopped
