version: "3.8"

services:
  mihomo:
    image: ghcr.io/hyird/mikrotik-mihomo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mihomo
    hostname: mihomo

    network_mode: host

    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
      - SYS_MODULE

    environment:
      - FAKE_CIDR=198.18.0.0/16
      - CLASH_WEB_PORT=80
      - DEFAULT_BACKEND_URL=auto
      - LOG_LEVEL=error
      - SLEEPTIME=30
      - SUBURL=https://example.com/subscribe
      - TZ=Asia/Shanghai

    restart: unless-stopped
